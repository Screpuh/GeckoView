<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>GeckoView</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #131722;
      --text-muted: #787b86;
      --border: #e0e3eb;
      --accent: #2962ff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #131722;
        --text: #d1d4dc;
        --text-muted: #868993;
        --border: #2a2e39;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 260px;
      margin: 0;
      padding: 14px 16px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Trebuchet MS", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
    }

    h1 {
      font-size: 15px;
      font-weight: 600;
      margin: 0 0 12px;
    }

    .gv-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 0;
    }

    .gv-row label {
      cursor: pointer;
    }

    .gv-hint {
      font-size: 11px;
      color: var(--text-muted);
      margin: 0 0 6px;
    }

    .gv-section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .03em;
      color: var(--text-muted);
      margin: 14px 0 2px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }

    input[type="checkbox"] {
      accent-color: var(--accent);
      width: 15px;
      height: 15px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .gv-text-input {
      width: 100%;
      padding: 6px 8px;
      margin-top: 4px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
    }

    .gv-text-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .gv-select {
      padding: 4px 6px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
    }

    .gv-select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .gv-link {
      color: var(--accent);
      text-decoration: none;
    }

    .gv-link:hover {
      text-decoration: underline;
    }

    .gv-save-status {
      display: block;
      font-size: 11px;
      color: var(--accent);
      margin-top: 4px;
      min-height: 14px;
      opacity: 0;
      transition: opacity .3s;
    }

    .gv-save-status.gv-visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <h1>GeckoView</h1>

  <div class="gv-row">
    <label for="gv-enabled">Show on TradingView</label>
    <input type="checkbox" id="gv-enabled">
  </div>
  <div class="gv-row">
    <label for="gv-auto-close-adblock">Auto-close ad-blocker popup</label>
    <input type="checkbox" id="gv-auto-close-adblock">
  </div>
  <p class="gv-hint">Refresh open TradingView tabs for either of these to take effect.</p>

  <div class="gv-section-title">Key stats to show</div>
  <div id="gv-stat-options"></div>

  <div class="gv-section-title">CoinGecko API key</div>
  <p class="gv-hint">
    Optional — raises your rate limit above the free anonymous tier.
    <a class="gv-link" href="https://www.coingecko.com/en/developers/dashboard" target="_blank">Get a free key</a>
  </p>
  <input type="text" id="gv-api-key" class="gv-text-input" placeholder="Paste your CoinGecko API key" autocomplete="off" spellcheck="false">
  <div class="gv-row">
    <label for="gv-api-key-type">Key type</label>
    <select id="gv-api-key-type" class="gv-select">
      <option value="demo">Demo (free)</option>
      <option value="pro">Pro (paid)</option>
    </select>
  </div>
  <p class="gv-hint">Demo and Pro keys use different CoinGecko endpoints, so this has to match your key.</p>
  <span class="gv-save-status" id="gv-api-key-status">Saved</span>

  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
